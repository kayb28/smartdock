name: Release debug apk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.15.0-fork.5)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: gradle

    - name: Grant execute permissions for gradlew
      run: chmod +x gradlew

    - name: Build debug apk
      run: ./gradlew assembleDebug

    - name: Rename apk
      run: cp app/build/outputs/apk/debug/app-debug.apk SmartDock-fork-debug.apk

    - name: Create GitHub release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ inputs.tag || github.ref_name }}
        name: SmartDock fork ${{ inputs.tag || github.ref_name }}
        files: SmartDock-fork-debug.apk
        generate_release_notes: true
